kind = "web"
previewPath = "/"
title = "Mesurado AI Dashboard"
version = "1.0.0"
id = "artifacts/mesurado-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22802

[services.development]
run = "pnpm --filter @workspace/mesurado-dashboard run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/mesurado-dashboard", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/mesurado-dashboard", "run", "start"]

[services.production.run.env]
PORT = "22802"
NODE_ENV = "production"

[services.env]
PORT = "22802"
BASE_PATH = "/"
