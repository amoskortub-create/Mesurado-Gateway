kind = "web"
previewPath = "/"
title = "Mesurado AI Dashboard"
version = "1.0.0"
id = "artifacts/mesurado-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22802

[services.development]
run = "pnpm --filter @workspace/mesurado-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mesurado-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/mesurado-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22802"
BASE_PATH = "/"
